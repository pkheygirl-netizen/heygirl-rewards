# Example Shopify app config. Copy to `shopify.app.toml` and fill in real values.
# `shopify.app.toml` is gitignored (kept local only). The client_secret is NEVER
# stored here: it lives in the environment (see .env.example / Railway variables).
#
# After changing anything in this file run `shopify app deploy`: that is what
# registers the webhook subscriptions and scopes below, and releases the theme
# app extension.
name = "HeyGirl Rewards"
client_id = "YOUR_SHOPIFY_CLIENT_ID"
application_url = "https://app.heygirl.pk"
embedded = true

[access_scopes]
# The script-tag scopes are gone (the storefront is a theme app extension).
# Removing scopes changes the permission list: the store must accept it again.
scopes = "read_customers,write_customers,read_orders,read_discounts,write_discounts,read_products,write_products,read_content,write_content"

[auth]
redirect_urls = ["https://app.heygirl.pk/auth/callback"]

[webhooks]
# Keep in step with API_VERSION in app/shopify.server.ts.
api_version = "2026-10"

  # Placing an order enrols the customer and stores the pending points.
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders-create"

  [[webhooks.subscriptions]]
  topics = ["orders/updated"]
  uri = "/webhooks/orders-updated"

  [[webhooks.subscriptions]]
  topics = ["orders/fulfilled"]
  uri = "/webhooks/orders-fulfilled"

  # Reverses points and blocks any later award.
  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "/webhooks/orders-cancelled"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/webhooks/refunds-create"

  [[webhooks.subscriptions]]
  topics = ["customers/create"]
  uri = "/webhooks/customers-create"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app-uninstalled"

  # Privacy webhooks go under compliance_topics (Shopify rejects them in `topics`).
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers-data-request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers-redact"

  # Records the request only. Nothing is deleted automatically (see README).
  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop-redact"

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[app_proxy]
url = "https://app.heygirl.pk/proxy"
subpath = "loyalty"
prefix = "apps"
